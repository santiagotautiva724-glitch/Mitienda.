<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Vibe Store</title>
    
    <!-- Aquí pondremos el diseño (CSS) en el siguiente paso -->
    <style>
     body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    text-align: center; 
    padding: 20px; 
    background: #f8f9fa; 
    color: #333;
}

h1 {
    color: #111;
    font-size: 28px;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Contenedor de las tarjetas de productos */
.productos { 
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 25px; 
    margin-top: 20px; 
}

/* Tarjeta de cada producto */
.card { 
    background: white; 
    padding: 20px; 
    border-radius: 15px; 
    width: 240px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

    .card img { 
        width: 100%; 
        height: 200px; 
        object-fit: contain; 
        background: #fdfdfd; 
        border-radius: 10px; 
        margin-bottom: 15px;
        padding: 10px;
    }


.card h3 {
    font-size: 16px;
    margin: 10px 0 5px 0;
    color: #222;
}

.card .descripcion {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
    margin-bottom: 15px;
}

/* Precios */
.precio-antes { 
    text-decoration: line-through; 
    color: #999; 
    margin: 0; 
    font-size: 14px;
}

.precio-ahora { 
    font-weight: bold; 
    font-size: 20px; 
    color: #e63946;
    margin: 2px 0 15px 0;
}

/* Botones */
.card button { 
    background: #111; 
    color: white; 
    border: none; 
    padding: 12px; 
    cursor: pointer; 
    border-radius: 8px; 
    font-weight: bold;
    width: 100%;
    transition: background 0.2s;
}

.card button:hover {
    background: #333;
}

/* Botón flotante de WhatsApp */
#btn-finalizar { 
    position: fixed; 
    bottom: 20px; 
    right: 20px; 
    padding: 15px 25px; 
    font-size: 16px; 
    background: #25D366; 
    color: white; 
    border: none; 
    border-radius: 50px; 
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    cursor: pointer;
}

#btn-finalizar:hover {
    background: #20ba5a;
}
        /* (El diseño va aquí adentro) */
    </style>
</head>
<body>

    <!-- Encabezado con el nuevo nombre -->
    <h1>Elite Vibe Store</h1>
    
    <!-- Contenedor donde se cargarán los productos automáticamente -->
    <div id="lista-productos" class="productos"></div>

    <!-- Botón flotante para comprar por WhatsApp -->
    <button id="btn-finalizar" onclick="enviarWhatsApp()">
        Comprar por WhatsApp (<span id="contador">0</span>)
    </button>

    <!-- Aquí pondremos la lógica (JavaScript) al final -->
    <script>
                const productos = [
            { 
                id: 1, 
                nombre: "AirPods Pro 3", 
                precio: 90000, 
                precioAnterior: 120000, 
                img: "https://i.ibb.co/WvR0dy0s/Screenshot-2026-05-30-02-36-31-71-40deb401b9ffe8e1df2f1cc5ba480b12.jpg",
                descripcion: "Sonido de alta calidad, cancelación de ruido, modo ambiente/adaptativo y traducción en tiempo real."
            }
        ];

        let carrito = [];
        const contenedor = document.getElementById('lista-productos');

        productos.forEach(p => {
            contenedor.innerHTML += `
                <div class="card">
                    <img src="${p.img}" alt="${p.nombre}">
                    <h3>${p.nombre}</h3>
                    <p class="precio-antes">$${p.precioAnterior.toLocaleString()}</p>
                    <p class="precio-ahora">$${p.precio.toLocaleString()}</p>
                    <p class="descripcion">${p.descripcion}</p>
                    <button onclick="agregar(${p.id})">Añadir al Carrito</button>
                </div>
            `;
        });

        function agregar(id) {
            carrito.push(productos.find(p => p.id === id));
            document.getElementById('contador').innerText = carrito.length;
        }

        function enviarWhatsApp() {
            if(carrito.length === 0) { alert("El carrito está vacío"); return; }
            let nombres = carrito.map(p => p.nombre).join(", ");
            window.open(`https://wa.me/573223693926?text=Hola, quiero comprar: ${nombres}`);
        }
        
    </script>

</body>
</html>
